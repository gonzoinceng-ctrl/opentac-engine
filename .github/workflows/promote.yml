name: promote

# Every 6 hours and on demand. Promotes the newest open canary to `stable`
# once the 72 h canary has elapsed, the gate verdict for that exact SHA is
# green, and the canary issue carries neither `hold` nor `reject`. Quiet when
# there is nothing to do. A manual run with force=true skips the policy
# checks (gate note, 72 h clock, labels, canary-ok) for hotfixes; it never skips
# the rules that protect history: the SHA must be in upstream main's history and
# `stable` only ever fast-forwards (no force push, ever).

on:
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: "Skip the canary clock, labels and gate-note checks (hotfix)"
        required: false
        type: boolean
        default: false
      sha:
        description: "Optional: promote the open canary for this (possibly abbreviated) SHA instead of the newest"
        required: false
        type: string
      severity:
        description: "Recorded in the stable tag. security bypasses the app's skipped-commit memory."
        required: false
        type: choice
        options:
          - normal
          - security
        default: normal

permissions:
  contents: write
  issues: write

concurrency:
  group: engine-refs
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  APP_REPO: gonzoinceng-ctrl/opentac-desktop

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Environment secret: only jobs that name this environment, and only on the opentac-ci
    # branch, can read ENGINE_PUSH_TOKEN. Pushes of third-party refs can never reach it.
    environment: engine-push
    env:
      ENGINE_PUSH_TOKEN: ${{ secrets.ENGINE_PUSH_TOKEN }}
      FORCE: ${{ inputs.force }}
      INPUT_SHA: ${{ inputs.sha }}
      SEVERITY: ${{ inputs.severity }}
      CANARY_OK_FIRST_N: ${{ vars.CANARY_OK_FIRST_N }}
    steps:
      - name: Require ENGINE_PUSH_TOKEN
        run: |
          if [ -z "$ENGINE_PUSH_TOKEN" ]; then
            echo "::error title=Missing secret::ENGINE_PUSH_TOKEN is not set (see README.md, Secrets)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.ENGINE_PUSH_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fetch mirror refs
        run: |
          source ci/lib.sh
          engine_init engine
          cd engine
          engine_fetch

      - name: Select the canary and check the preconditions
        id: select
        working-directory: engine
        run: |
          source ../ci/lib.sh
          force=false
          [ "$FORCE" != true ] || force=true
          out() { echo "$1" >> "$GITHUB_OUTPUT"; }
          out "go=false"

          # ---- pick the canary issue (newest, or the one matching INPUT_SHA)
          numbers=$(gh issue list --state open --label canary --limit 50 --json number --jq 'map(.number) | sort | reverse | .[]')
          if [ -z "$numbers" ]; then
            echo "no open canary issue; nothing to do"
            exit 0
          fi
          issue=""
          if [ -n "$INPUT_SHA" ]; then
            if ! [[ "$INPUT_SHA" =~ ^[0-9a-f]{7,40}$ ]]; then
              echo "::error title=Bad sha::sha must be 7 to 40 lowercase hex characters"
              exit 1
            fi
            for n in $numbers; do
              gh issue view "$n" --json body --jq .body > ../body.md
              s=$(node ../ci/canary.mjs parse-body --file ../body.md 2> /dev/null | jq -r .sha || true)
              if [ -n "$s" ] && [[ "$s" == "$INPUT_SHA"* ]]; then issue=$n; break; fi
            done
            if [ -z "$issue" ]; then
              echo "::error title=No such canary::no open canary issue matches ${INPUT_SHA}"
              exit 1
            fi
          else
            issue=$(echo "$numbers" | head -n 1)
          fi

          gh issue view "$issue" --json body,labels > ../issue.json
          jq -r .body ../issue.json > ../body.md
          if ! node ../ci/canary.mjs parse-body --file ../body.md > ../data.json; then
            echo "::error title=Canary JSON missing::issue #${issue} has no machine-readable canary block"
            exit 1
          fi
          sha=$(jq -r .sha ../data.json)
          ready_at=$(jq -r .readyAt ../data.json)
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "${sha}^{commit}" 2> /dev/null; then
            echo "::error title=Unknown SHA::canary #${issue} names ${sha}, which is not a commit on the mirror"
            exit 1
          fi
          labels=",$(jq -r '[.labels[].name] | join(",")' ../issue.json),"
          stable=$(git rev-parse --verify --quiet 'refs/remotes/origin/stable^{commit}' || true)
          candidate=$(git rev-parse --verify --quiet 'refs/remotes/origin/candidate^{commit}' || true)
          upstream_main=$(git rev-parse --verify 'refs/remotes/origin/upstream-main^{commit}')

          # ---- rules that even force never skips
          if ! git merge-base --is-ancestor "$sha" "$upstream_main"; then
            echo "::error title=Not an upstream commit::${sha} is not in upstream-main's history; refusing"
            exit 1
          fi

          # ---- idempotence: already stable
          if [ "$stable" = "$sha" ]; then
            existing=$(git tag --points-at "$sha" --list 'stable-*' | head -n 1)
            if [ -n "$existing" ]; then
              echo "stable already at ${sha:0:7} (${existing}); closing the canary issue quietly"
              gh issue close "$issue" --reason completed --comment "Already promoted as \`${existing}\`." > /dev/null || true
              exit 0
            fi
            echo "stable is already at ${sha:0:7} but no stable-* tag exists; finishing the bookkeeping"
          elif [ -n "$stable" ] && ! git merge-base --is-ancestor "$stable" "$sha"; then
            echo "::error title=Not a descendant of stable::${sha:0:7} does not descend from stable ${stable:0:7}; stable only fast-forwards"
            exit 1
          fi

          # ---- policy checks (skipped by force)
          if [ "$force" = false ]; then
            note=$(git notes --ref=refs/notes/gate show "$sha" 2> /dev/null || true)
            note_ok=$(printf '%s' "$note" | jq -r --arg sha "$sha" 'try (select(.sha == $sha and .gateResult == "green") | "yes") catch "no"' 2> /dev/null || true)
            issue_ok=$(jq -r 'select(.gateResult == "green") | "yes"' ../data.json)
            if [ "$note_ok" != yes ] || [ "$issue_ok" != yes ]; then
              echo "::error title=No green verdict::no green gate verdict recorded for exactly ${sha:0:7} (git note: ${note_ok:-no}, issue: ${issue_ok:-no})"
              exit 1
            fi
            if [ -n "$candidate" ] && [ "$candidate" != "$sha" ]; then
              echo "::error title=Candidate moved::candidate is ${candidate:0:7} but this canary is for ${sha:0:7}"
              exit 1
            fi
            case "$labels" in
              *,reject,*)
                echo "canary #${issue} is labelled reject; closing it"
                gh issue close "$issue" --reason "not planned" --comment "Rejected by label. \`stable\` stays where it is; the next intake replaces the candidate." > /dev/null
                exit 0
                ;;
              *,hold,*)
                echo "canary #${issue} is on hold"
                exit 0
                ;;
            esac
            if ! node ../ci/canary.mjs is-ready --ready-at "$ready_at"; then
              echo "canary #${issue} not ready until $(node ../ci/canary.mjs promote-after --ready-at "$ready_at")"
              exit 0
            fi
            n_promoted=$(git tag --list 'stable-*' | wc -l | tr -d ' ')
            first_n=${CANARY_OK_FIRST_N:-3}
            if [ "$n_promoted" -lt "$first_n" ]; then
              case "$labels" in
                *,canary-ok,*) ;;
                *)
                  echo "::notice title=Waiting for canary-ok::promotion $((n_promoted + 1)) of the first ${first_n} needs the canary-ok label on #${issue}"
                  exit 0
                  ;;
              esac
            fi
          fi

          {
            echo "go=true"
            echo "issue=${issue}"
            echo "sha=${sha}"
            echo "stable_sha=${stable}"
            echo "upstream_tag=$(jq -r '.upstreamTag // "main"' ../data.json)"
            echo "range=$(jq -r '.commitRange // ""' ../data.json)"
            echo "gate_run=$(jq -r '.gateRunUrl // ""' ../data.json)"
            echo "min_shell=$(jq -r '.minShell // "0.0.0"' ../data.json)"
            echo "ready_at=${ready_at}"
          } >> "$GITHUB_OUTPUT"

      - name: Promote stable
        if: ${{ steps.select.outputs.go == 'true' }}
        working-directory: engine
        env:
          ISSUE: ${{ steps.select.outputs.issue }}
          SHA: ${{ steps.select.outputs.sha }}
          STABLE_SHA: ${{ steps.select.outputs.stable_sha }}
          UPSTREAM_TAG: ${{ steps.select.outputs.upstream_tag }}
          RANGE: ${{ steps.select.outputs.range }}
          GATE_RUN: ${{ steps.select.outputs.gate_run }}
          MIN_SHELL: ${{ steps.select.outputs.min_shell }}
          READY_AT: ${{ steps.select.outputs.ready_at }}
        run: |
          source ../ci/lib.sh
          git -C .. config user.name "opentac-engine-bot"
          git -C .. config user.email "opentac-engine-bot@users.noreply.github.com"
          if ! [[ "$SEVERITY" =~ ^(normal|security)$ ]]; then SEVERITY=normal; fi

          # Re-read the labels immediately before pushing: a hold added during this run still wins.
          if [ "$FORCE" != true ]; then
            labels=",$(gh issue view "$ISSUE" --json labels --jq '[.labels[].name] | join(",")'),"
            case "$labels" in
              *,hold,* | *,reject,*)
                echo "hold or reject appeared on #${ISSUE} while this run was starting; not promoting"
                exit 0
                ;;
            esac
          fi

          # stable: fast-forward only (no --force anywhere in this file).
          if [ "$STABLE_SHA" != "$SHA" ]; then
            git push origin "${SHA}:refs/heads/stable"
          fi

          # Annotated, immutable tag: stable-YYYY.MM.DD[-N].
          git tag --list 'stable-*' > ../existing-tags.txt
          tag=$(node ../ci/canary.mjs stable-tag --date "$(date -u +%F)" --existing-file ../existing-tags.txt)
          canary_days=$(node ../ci/canary.mjs canary-days --ready-at "$READY_AT")
          {
            printf 'OpenTac engine %s\n\n' "$tag"
            printf 'upstreamTag: %s\n' "$UPSTREAM_TAG"
            printf 'commitRange: %s\n' "$RANGE"
            printf 'gateRun: %s\n' "$GATE_RUN"
            printf 'canaryDays: %s\n' "$canary_days"
            printf 'minShell: %s\n' "$MIN_SHELL"
            printf 'severity: %s\n' "$SEVERITY"
          } > ../tagmsg.txt
          git tag -a "$tag" "$SHA" -F ../tagmsg.txt
          git push origin "refs/tags/${tag}"

          # Tell the app repo right after the tag push (payload is only tag + sha; the app also polls,
          # so a failed dispatch is not fatal).
          GH_TOKEN="$ENGINE_PUSH_TOKEN" gh api "repos/${APP_REPO}/dispatches" \
            -f event_type=engine-promoted -f "client_payload[tag]=${tag}" -f "client_payload[sha]=${SHA}" > /dev/null \
            || echo "::warning title=Dispatch failed::could not notify ${APP_REPO}; its scheduled poll will pick up ${tag}"

          # Non-fatal and ordered after the dispatch: stable and the tag are already pushed, so a lost
          # race on the default branch must not skip the app notification or leave the canary open.
          deps=unknown
          range_short="${SHA:0:7}"
          # (errexit is ignored inside a subshell used as an `if` condition, so switch it off around
          # a subshell that sets its own `set -e`.)
          set +e
          (
            set -e
            old=""
            case "$RANGE" in *..*) old=${RANGE%%..*} ;; esac
            if [ -n "$old" ] && git cat-file -e "${old}^{commit}" 2> /dev/null; then
              git log --format='%h%x09%s' "${old}..${SHA}" > ../log.txt
              git diff --stat=100,60 "$old" "$SHA" | tail -n 40 > ../diffstat.txt
              if git diff --quiet "$old" "$SHA" -- package-lock.json; then deps=no; else deps=yes; fi
              range_short="${old:0:7}..${SHA:0:7}"
            else
              git log --max-count=100 --format='%h%x09%s' "$SHA" > ../log.txt
              : > ../diffstat.txt
              deps=yes
              range_short="${SHA:0:7} (first promotion, last 100 commits)"
            fi
            printf 'deps=%q\nrange_short=%q\n' "$deps" "$range_short" > ../relvars.sh
            node ../ci/canary.mjs release-entry --tag "$tag" --date "$(date -u +%F)" --range "$range_short" \
              --log ../log.txt --diffstat ../diffstat.txt --deps "$deps" --upstream-tag "$UPSTREAM_TAG" \
              --gate-run "$GATE_RUN" --canary-days "$canary_days" --min-shell "$MIN_SHELL" --severity "$SEVERITY" > ../entry.md
            node ../ci/canary.mjs prepend-release --file ../RELEASES.md --entry ../entry.md
            git -C .. add RELEASES.md
            git -C .. commit --quiet -m "releases: ${tag} (${SHA:0:7})"
            push_default_branch .. "$DEFAULT_BRANCH"
          )
          rel_rc=$?
          set -e
          # shellcheck disable=SC1091
          [ ! -f ../relvars.sh ] || source ../relvars.sh
          if [ "$rel_rc" -ne 0 ]; then
            echo "::warning title=RELEASES.md not updated::could not commit the RELEASES.md entry for ${tag}; add it by hand"
          fi

          # Close the canary LAST: if anything above aborts, the next run still sees the open canary.
          gh issue comment "$ISSUE" --body "Promoted: \`stable\` is now \`${SHA:0:7}\`, tagged \`${tag}\` (canary ${canary_days} day(s), severity ${SEVERITY}). Release notes are in RELEASES.md." > /dev/null
          gh issue close "$ISSUE" --reason completed > /dev/null

          {
            echo "### Promoted \`${tag}\`"
            echo "- stable: \`${SHA}\`"
            echo "- upstream: ${UPSTREAM_TAG}, range ${range_short}"
            echo "- dependencies changed: ${deps}"
          } >> "$GITHUB_STEP_SUMMARY"
